<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>意见反馈</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="bg-decor"></div>

    <header class="topbar">
      <div class="brand"><span class="logo-dot"></span> 科普调研中心</div>
      <a class="login-link" href="/admin.html">管理员登录</a>
    </header>

    <main class="page">
      <section class="hero">
        <p class="eyebrow">FEEDBACK</p>
        <h1>意见反馈</h1>
        <p class="subtitle">
          欢迎留下您的任何意见或建议，帮助我们做得更好。<br />
          无需登录、全部选填，写下想法后点击提交即可。
        </p>
      </section>

      <section class="card form-card">
        <form id="surveyForm" novalidate>
          <div class="field">
            <label for="opinion">意见与建议 <span style="color: var(--muted); font-weight: 400">（选填）</span></label>
            <textarea id="opinion" name="opinion" placeholder="欢迎留下您的任何想法～" maxlength="2000" rows="6"></textarea>
          </div>

          <button type="submit" class="btn-primary">提交</button>
          <p id="msg" class="msg"></p>
        </form>
      </section>

      <footer class="foot">© 2026 科普调研中心 · 您的意见对我们很重要</footer>
    </main>

    <script src="/js/index.js"></script>
  </body>
</html>
