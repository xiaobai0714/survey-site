<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>管理后台 · 问卷记录</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="bg-decor"></div>

    <header class="topbar">
      <div class="brand"><span class="logo-dot"></span> 科普调研中心 · 管理后台</div>
      <a class="login-link" href="/">返回问卷</a>
    </header>

    <main class="page">
      <!-- 登录视图 -->
      <section id="loginView" class="card login-card">
        <h2>管理员登录</h2>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="username">账号</label>
            <input type="text" id="username" name="username" placeholder="请输入管理员账号" autocomplete="username" />
          </div>
          <div class="field">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" />
          </div>
          <button type="submit" class="btn-primary">登录</button>
          <p id="loginMsg" class="msg"></p>
        </form>
      </section>

      <!-- 数据视图 -->
      <section id="dashView" class="card dash-card" style="display: none">
        <div class="dash-head">
          <h2>问卷提交记录 <span class="count" id="count"></span></h2>
          <div class="dash-actions">
            <input type="text" id="search" placeholder="按姓名搜索…" />
            <button id="exportBtn" class="btn-ghost">导出 CSV</button>
            <button id="logoutBtn" class="btn-ghost">退出登录</button>
          </div>
        </div>
        <div class="table-wrap">
          <table id="tbl">
            <thead>
              <tr>
                <th>提交时间</th>
                <th>姓名</th>
                <th>年龄</th>
                <th>职业</th>
                <th>满意度</th>
                <th>使用效果</th>
                <th>意见</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/js/admin.js"></script>
  </body>
</html>
